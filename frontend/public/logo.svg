<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#1F5D3A" />
      <stop offset="100%" stop-color="#144629" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#D4A017" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Loop Arc 1 -->
  <path d="M 60 15 A 45 45 0 0 1 105 60 A 45 45 0 0 1 75 101" 
        fill="none" 
        stroke="url(#leafGrad)" 
        stroke-width="9" 
        stroke-linecap="round" />

  <!-- Circular Loop Arc 2 -->
  <path d="M 60 105 A 45 45 0 0 1 15 60 A 45 45 0 0 1 45 19" 
        fill="none" 
        stroke="url(#leafGrad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-dasharray="8 4" />

  <!-- The Looping Leaf inside -->
  <path d="M 35 65 C 35 40, 75 30, 85 35 C 90 55, 70 85, 45 85 C 38 85, 35 75, 35 65 Z" 
        fill="url(#leafGrad)" 
        filter="url(#glow)" />

  <!-- Kasavu Gold Center Leaf Spine -->
  <path d="M 40 70 Q 60 55 80 38" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" />

  <!-- Arrow Tip on the loop -->
  <polygon points="50,15 42,9 44,23" fill="#D4A017" />
  <circle cx="75" cy="101" r="5" fill="#22C55E" />
</svg>
